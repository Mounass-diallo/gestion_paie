<div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Information relative a  la Classe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addClasse" type="submit">Add Classe</button>
        </div>
      </div>
  </nav>
  
  <table class="table table-hover">
      <thead>
        <tr>
          <th scope="col">id </th>
  
  
  
          <th scope="col">Name</th>
  
          
  
          <th scope="col">Action</th>
  
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let classe of clasList">
          <td>{{classe.id}}</td>
  
          <td>{{classe.name}}</td>
          
          
          <td>
              <button type="button" class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#editClasse" (click)="editClasse(classe)">Modifier</button>
              <button type="button" class="btn btn-outline-danger" (click)="deleteClasse(classe)">Supprimer</button>
          </td>
  
        </tr>
        
      </tbody>
    </table>
  
  
  <!-- Add Classe modal -->
  <div class="modal fade" id="addClasse" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">saisir les infos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
          <form [formGroup]="clasDetail">
              <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Name </label>
                  <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                </div>
              
      
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                  <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="addClasse()">Ajout un Classe</button>
                </div>
            </form>
      </div>
    </div>
  </div>
  </div>
  
  
  <!-- Edit Classe modal -->
  <div class="modal fade" id="editClasse" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Edit Classe details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
  
          <form [formGroup]="clasDetail">
              <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Name </label>
                  <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                </div>
            
             
              <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                  <button type="button" class="btn btn-outline-success" (click)="updateClasse()" data-bs-dismiss="modal">update</button>
                </div>
            </form>
      </div>
    </div>
  </div>
  </div>
  </div>
