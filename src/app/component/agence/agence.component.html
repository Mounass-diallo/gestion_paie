<div class="container-fluid">

    <nav class="navbar navbar-expand-lg navbar-light bg-light" >
        <div class="container-fluid" >
          <a class="navbar-brand" href="#"></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addAgence" type="submit">Ajouter une Agence</button>
          </div>
        </div>
    </nav>
    <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">banque</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
            <tr *ngFor="let agence of agenList">
                <td>{{agence.id}}</td>
                <td>{{agence.name}}</td>
                <td>{{agence.banque?.name}}</td>
                
                
                <td>
                    <button type="button" class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#editAgence" (click)="editAgence(agence)">Modifier</button>
                    <button type="button" class="btn btn-outline-danger" (click)="deleteAgence(agence)">Supprimer</button>
                </td>
        
              </tr>
              
            </tbody>
          </table>
          <!-- Add agence modal -->
<div class="modal fade" id="addAgence" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">saisir une agence</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          
            <form [formGroup]="agenDetail">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Name </label>
                    <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="banque" class="form-label">Banque :</label>
                    <select formControlName="banqueId" id="banque" class="form-control" cSelect>
                      <option disabled [defaultSelected]="true" >choisir</option>
                      <option *ngFor="let banque of banList" [value]="banque.id">({{ banque.name }})</option>
                    </select>
                  </div>
        
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="addAgence()">Ajout un agence</button>
                  </div>
              </form>
        </div>
      </div>
    </div>
    </div>
    <!-- Edit banque modal -->
<div class="modal fade" id="editAgence" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Edit agence details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
    
            <form [formGroup]="agenDetail">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Name </label>
                    <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="banque" class="form-label">Banque :</label>
                    <select formControlName="banqueId" id="banque" class="form-control" cSelect>
                      <option disabled [defaultSelected]="true" >choisir</option>
                      <option *ngFor="let banque of banList" [value]="banque.id">({{ banque.name }})</option>
                    </select>
                  </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-outline-success" (click)="updateAgence()" data-bs-dismiss="modal">update</button>
                  </div>
              </form>
        </div>
      </div>
    </div>
    </div>
    </div>
