<div class="container-fluid">

    <nav class="navbar navbar-expand-lg navbar-light bg-light" >
        <div class="container-fluid" >
          <a class="navbar-brand" href="#"></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addTypePaie" type="submit">Ajouter type de paie</button>
          </div>
      
        </div>
    </nav>

<table class="table table-hover">
    <thead>
      <tr>
        <th scope="col">id </th>



        <th scope="col">Name</th>

        

        <th scope="col">Action</th>

      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let typepaie of typeList">
        <td>{{typepaie.id}}</td>

        <td>{{typepaie.name}}</td>
        
        
        <td>
            <button type="button" class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#editTypePaie" (click)="editTypePaie(typepaie)">Modifier</button>
            <button type="button" class="btn btn-outline-danger" (click)="deleteTypePaie(typepaie)">Supprimer</button>
        </td>

      </tr>
      
    </tbody>
  </table>


<!-- Add TypeDePaie modal -->
<div class="modal fade" id="addTypePaie" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">saisir les infos</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      
        <form [formGroup]="typeDetail">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Name </label>
                <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
              </div>
            
    
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="addTypePaie()">Ajout un TypeDePaie</button>
              </div>
          </form>
    </div>
  </div>
</div>
</div>


<!-- Edit TypeDePaie modal -->
<div class="modal fade" id="editTypePaie" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Modifier TypeDePaie details</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">

        <form [formGroup]="typeDetail">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Name </label>
                <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
              </div>
          
           
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-outline-success" (click)="updateTypePaie()" data-bs-dismiss="modal">update</button>
              </div>
          </form>
    </div>
  </div>
</div>
</div>
</div>
