<div class="container-fluid">

    <nav class="navbar navbar-expand-lg navbar-light bg-light" >
        <div class="container-fluid" >
          <!-- <a class="navbar-brand" href="#">Gestion de Paie</a> -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addEmployee" type="submit">Ajouter un employé</button>
          </div>
      
        </div>
    </nav>



    <table  class="table table-hover">
        <thead>
          <tr>
            <th scope="col">Employee ID</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Matricule</th>
            <th scope="col">Numero CNI</th>
            <th scope="col">Etat civil</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let employee of empList">
            <td>{{employee.id}}</td>
            <td>{{employee.name}}</td>
            <td>{{employee.email}}</td>
            <td>{{employee.matricule}}</td>
            <td>{{employee.numeroCNI}}</td>
            <td>{{employee.civil?.name}}</td>
            <td>
                <button type="button" class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#editEmployee" (click)="editEmployee(employee)">Modifier</button>
                <button type="button" class="btn btn-outline-danger" (click)="deleteEmployee(employee)">Supprimer</button>
                <button type="button" class="btn btn-outline-primary me-2" (click)="FichePaie(employee.id)">Voir fiche paie</button>
            </td>

          </tr>
          
        </tbody>
      </table>

  
  <!-- Add employee modal -->
  <div class="modal fade" id="addEmployee" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Ajouter un nouveau employé</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          
            <form [formGroup]="empDetail">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Name </label>
                    <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="text"  formControlName="email" class="form-control" id="email" aria-describedby="emailHelp">
                  </div>
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Matricule </label>
                  <input type="text" formControlName="matricule" class="form-control" id="matricule" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Numero CNI</label>
                    <input type="text" formControlName="numeroCNI" class="form-control" id="numeroCNI"describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="civil" class="form-label">Etat Civil :</label>
                    <select formControlName="civilId" id="civil" class="form-control" cSelect>
                      <option disabled [defaultSelected]="true" >choisir</option>
                      <option *ngFor="let civil of civList" [value]="civil.id">({{ civil.name }})</option>
                    </select>
                  </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="addEmployee()">Ajout employé</button>
                  </div>
              </form>

        </div>
        
      </div>
    </div>
  </div>

  
  <!-- Edit employee modal -->
  <div class="modal fade" id="editEmployee" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Modifier les détails d'un employé</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

            <form [formGroup]="empDetail">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Name </label>
                    <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="text"  formControlName="email" class="form-control" id="email" aria-describedby="emailHelp">
                    </div>
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Matricule </label>
                  <input type="text" formControlName="matricule" class="form-control" id="matricule" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Numero CNI</label>
                    <input type="text" formControlName="numeroCNI" class="form-control" id="numeroCNI" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="civil" class="form-label">Etat Civil :</label>
                    <select formControlName="civilId" id="civil" class="form-control" cSelect>
                      <option disabled [defaultSelected]="true" >choisir</option>
                      <option *ngFor="let civil of civList" [value]="civil.id">({{ civil.name }})</option>
                    </select>
                  </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-outline-success" (click)="updateEmployee()" data-bs-dismiss="modal">Mettre à jour</button>
                  </div>
              </form>

        </div>
      </div>
    </div>
  </div>


</div>
