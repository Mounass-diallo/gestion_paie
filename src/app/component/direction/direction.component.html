<div class="container-fluid">

    <nav class="navbar navbar-expand-lg navbar-light bg-light" >
        <div class="container-fluid" >
          <a class="navbar-brand" href="#">Direction</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#addDirection" type="submit">Ajouter un direction</button>
          </div>
      
        </div>
    </nav>
    <table  class="table table-hover">
        <thead>
          <tr>
            <th scope="col">Direction ID</th>
            <th scope="col">Name</th>
        </tr>
    </thead>
    <tbody>
      <tr *ngFor="let direction of direcList">
        <td>{{direction.id}}</td>
        <td>{{direction.name}}</td>
        <td>
            <button type="button" class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#editDirection" (click)="editDirection(direction)">Modifier</button>
            <button type="button" class="btn btn-outline-danger" (click)="deleteDirection(direction)">Supprimer</button>
        </td>

      </tr>
      
    </tbody>
  </table>
  <!-- Add direction modal -->
  <div class="modal fade" id="addDirection" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Ajouter un nouveau direction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          
            <form [formGroup]="direcDetail">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Name </label>
                    <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                  </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="addDirection()">Ajout direction</button>
                  </div>
              </form>

        </div>
        
      </div>
    </div>
  </div>
  <!-- Edit direction modal -->
  <div class="modal fade" id="editDirection" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Modifier les détails d'un direction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

            <form [formGroup]="direcDetail">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Name </label>
                    <input type="text" formControlName="name" class="form-control" id="name" aria-describedby="emailHelp">
                  </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-outline-success" (click)="updateDirection()" data-bs-dismiss="modal">Mettre à jour</button>
                  </div>
              </form>

        </div>
      </div>
    </div>
  </div>


</div>
